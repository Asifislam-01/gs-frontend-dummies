<body>
    <div class="container">
        <div class="header">
            <h1>Ground Station Web App </h1>
        </div>
        
        <div class="connection-panel">
            <h2>Connection</h2>
            <input type="text" id="serverIp" placeholder="EC2 IP" value="43.204.19.202">
            <button onclick="connect()">Connect</button>
            <button onclick="disconnect()">Disconnect</button>
            <div id="status" class="status-box disconnected">
                Status: Disconnected
            </div>
        </div>

        <div class="stats-panel">
            <h2>System Statistics</h2>
            <button onclick="fetchNodes()">Fetch Nodes</button>
            <button onclick="fetchStats()">Refresh Stats</button>
            <div class="stats-grid" id="systemStats">
                <div class="stat-item">
                    <div class="stat-value" id="totalNodes">0</div>
                    <div class="stat-label">Active Nodes</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value" id="totalTelemetry">0</div>
                    <div class="stat-label">Total Telemetry Records</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value" id="lastUpdate">--</div>
                    <div class="stat-label">Last Update</div>
                </div>
            </div>
        </div>

        <h2>Active Nodes Telemetry</h2>
        <div class="nodes-grid" id="nodesGrid">
            <div style="grid-column: 1 / -1; text-align: center; color: #888; padding: 40px;">
            </div>
        </div>

        <div class="stats-panel">
            <h2> Uploaded Files</h2>
            <button onclick="fetchFiles()">Refresh Files</button>
            <div id="filesGrid" style="margin-top: 20px;">
            </div>
        </div>

        <div class="telemetry-log">
            <h2>Telemetry Log</h2>
            <div id="telemetryLog"></div>
        </div>
    </div>

    <script>
        let socket = null;
        const nodes = new Map(); 
        function log(message, type = 'info') {
            const logDiv = document.getElementById('telemetryLog');
            const entry = document.createElement('div');
            entry.className = `log-entry ${type}`;
            entry.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
            logDiv.appendChild(entry);
            logDiv.scrollTop = logDiv.scrollHeight;
        }
        
        function updateStatus(text, connected) {
            const status = document.getElementById('status');
            status.textContent = 'Status: ' + text;
            status.className = 'status-box ' + (connected ? 'connected' : 'disconnected');
        }
        
        function connect() {
            if (socket) {
                socket.disconnect();
            }
            
            const ip = document.getElementById('serverIp').value;
            const url = `http://${ip}:3001`;
            log(`Connecting to ${url} as webapp...`, 'node-connect');
            
            socket = io(url);
            
            socket.on('connect', () => {
                log(`Connected! Socket ID: ${socket.id}`, 'node-connect');
                updateStatus('Connected', true);
                socket.emit('identify', { type: 'webapp', nodeId: null });
            });
            
            socket.on('disconnect', () => {
                log(' Disconnected from server', 'node-disconnect');
                updateStatus('Disconnected', false);
            });
            
            socket.on('nodes-list', (nodesList) => {
                log(`Received nodes list: ${nodesList.length} nodes`, 'info');
                nodesList.forEach(node => {
                    if (node.status === 'online' && !nodes.has(node.node_id)) {
                        createNodePanel(node.node_id);
                    }
                });
            });
            
            socket.on('telemetry-update', (data) => {
                handleTelemetryUpdate(data);
            });
            
            socket.on('node-status', (data) => {
                log(`Node ${data.nodeId} is ${data.status}`, 'info');
                if (data.status === 'offline') {
                    markNodeInactive(data.nodeId);
                } else if (data.status === 'online') {
                    if (!nodes.has(data.nodeId)) {
                        createNodePanel(data.nodeId);
                    }
                }
            });
        }
        
        function handleTelemetryUpdate(data) {
            const nodeId = data.nodeId;
            const now = new Date();
            
            log(`[${nodeId}] Az=${data.azimuth.toFixed(1)}° El=${data.elevation.toFixed(1)}° Signal=${data.signalStrength.toFixed(1)}dBm Temp=${data.temperature.toFixed(1)}°C`);
            
            if (!nodes.has(nodeId)) {
                createNodePanel(nodeId);
            }
            
            const nodeData = nodes.get(nodeId);
            nodeData.data = data;
            nodeData.lastUpdate = now;
            
            updateNodePanel(nodeId, data, now);
            updateSystemStats();
        }
        
        function createNodePanel(nodeId) {
            const grid = document.getElementById('nodesGrid');
            
            // Remove placeholder if exists
            const placeholder = grid.querySelector('div[style*="grid-column"]');
            if (placeholder) {
                placeholder.remove();
            }
            
            const panel = document.createElement('div');
            panel.className = 'node-panel';
            panel.id = `node-${nodeId}`;
            
            panel.innerHTML = `
                <div class="node-header">
                    <div class="node-id">${nodeId}</div>
                    <div class="node-status active">Active</div>
                </div>
                <div class="metric">
                    <span class="metric-label">Azimuth:</span>
                    <span class="metric-value" id="az-${nodeId}">--</span>
                </div>
                <div class="metric">
                    <span class="metric-label">Elevation:</span>
                    <span class="metric-value" id="el-${nodeId}">--</span>
                </div>
                <div class="metric">
                    <span class="metric-label">Signal Strength:</span>
                    <span class="metric-value" id="sig-${nodeId}">--</span>
                </div>
                <div class="metric">
                    <span class="metric-label">Temperature:</span>
                    <span class="metric-value" id="temp-${nodeId}">--</span>
                </div>
                <div class="last-update" id="update-${nodeId}">--</div>
            `;
            
            grid.appendChild(panel);
            
            nodes.set(nodeId, {
                data: null,
                lastUpdate: null,
                element: panel
            });
            
            log(`New node connected: ${nodeId}`, 'node-connect');
        }
        
        function updateNodePanel(nodeId, data, timestamp) {
            document.getElementById(`az-${nodeId}`).textContent = data.azimuth.toFixed(2) + '°';
            document.getElementById(`el-${nodeId}`).textContent = data.elevation.toFixed(2) + '°';
            document.getElementById(`sig-${nodeId}`).textContent = data.signalStrength.toFixed(1) + ' dBm';
            document.getElementById(`temp-${nodeId}`).textContent = data.temperature.toFixed(1) + '°C';
            document.getElementById(`update-${nodeId}`).textContent = `Last: ${timestamp.toLocaleTimeString()}`;
            
            const panel = document.getElementById(`node-${nodeId}`);
            panel.classList.remove('inactive');
            const status = panel.querySelector('.node-status');
            status.textContent = 'Active';
            status.classList.add('active');
            status.classList.remove('inactive');
        }
        
        function markNodeInactive(nodeId) {
            if (nodes.has(nodeId)) {
                const panel = document.getElementById(`node-${nodeId}`);
                if (panel) {
                    panel.classList.add('inactive');
                    const status = panel.querySelector('.node-status');
                    status.textContent = 'Inactive';
                    status.classList.remove('active');
                    status.classList.add('inactive');
                }
            }
        }
        
        function disconnect() {
            if (socket) {
                socket.disconnect();
                socket = null;
                updateStatus('Disconnected', false);
                log('Disconnected', 'node-disconnect');
            }
        }
        
        async function fetchStats() {
            const ip = document.getElementById('serverIp').value;
            
            try {
                // Fetch all nodes
                const nodesResponse = await fetch(`http://${ip}:3000/api/nodes`);
                const nodesResult = await nodesResponse.json();
                
                if (nodesResult.success) {
                    const nodesList = nodesResult.data;
                    document.getElementById('totalNodes').textContent = nodesList.filter(n => n.status === 'online').length;
                    
                    let totalRecords = 0;
                    let lastUpdate = null;
                    
                    for (const node of nodesList) {
                        try {
                            const statsResponse = await fetch(`http://${ip}:3000/api/stats/${node.node_id}`);
                            const statsResult = await statsResponse.json();
                            
                            if (statsResult.success && statsResult.data) {
                                totalRecords += parseInt(statsResult.data.total_records || 0);
                                if (statsResult.data.last_update) {
                                    if (!lastUpdate || new Date(statsResult.data.last_update) > new Date(lastUpdate)) {
                                        lastUpdate = statsResult.data.last_update;
                                    }
                                }
                            }
                        } catch (err) {
                            // Skip if stats fetch fails for a node
                        }
                    }
                    
                    document.getElementById('totalTelemetry').textContent = totalRecords;
                    document.getElementById('lastUpdate').textContent = lastUpdate ? new Date(lastUpdate).toLocaleString() : '--';
                }
            } catch (error) {
                log(`Error fetching stats: ${error.message}`, 'info');
            }
        }
        
        async function fetchNodes() {
            const ip = document.getElementById('serverIp').value;
            
            try {
                const response = await fetch(`http://${ip}:3000/api/nodes`);
                const result = await response.json();
                
                if (result.success) {
                    log(`Fetched ${result.data.length} nodes from database`, 'info');
                    result.data.forEach(node => {
                        if (node.status === 'online' && !nodes.has(node.node_id)) {
                            createNodePanel(node.node_id);
                        }
                    });
                    updateSystemStats();
                }
            } catch (error) {
                log(`Error fetching nodes: ${error.message}`, 'info');
            }
        }
        
        function updateSystemStats() {
          
            let activeCount = 0;
            nodes.forEach((nodeData, nodeId) => {
                const panel = document.getElementById(`node-${nodeId}`);
                if (panel && !panel.classList.contains('inactive')) {
                    activeCount++;
                }
            });
            document.getElementById('totalNodes').textContent = activeCount;
        }
        socket.on('new-file', (data) => {
            log(` New file uploaded by ${data.nodeId}: ${data.filename} (${(data.fileSize / 1024 / 1024).toFixed(2)} MB)`, 'node-connect');
            fetchFiles(); // Refresh file list
        });
        
        async function fetchFiles() {
            const ip = document.getElementById('serverIp').value;
            
            try {
                const response = await fetch(`http://${ip}:3000/api/files?limit=20`);
                const result = await response.json();
                
                if (result.success) {
                    displayFiles(result.data);
                    log(`Fetched ${result.data.length} files from database`, 'info');
                }
            } catch (error) {
                log(`Error fetching files: ${error.message}`, 'info');
            }
        }
        
        function displayFiles(files) {
            const filesGrid = document.getElementById('filesGrid');
            
            if (files.length === 0) {
                filesGrid.innerHTML = '<em style="color: #888;">No files uploaded yet.</em>';
                return;
            }
            
            filesGrid.className = 'files-grid';
            filesGrid.innerHTML = '';
            
            files.forEach(file => {
                const card = document.createElement('div');
                card.className = 'file-card';
                
                const uploadDate = new Date(file.upload_timestamp);
                const fileSize = (file.file_size / 1024 / 1024).toFixed(2);
                
                card.innerHTML = `
                    <h4> ${file.filename}</h4>
                    <div class="file-info"><strong>Node:</strong> ${file.node_id}</div>
                    <div class="file-info"><strong>Size:</strong> ${fileSize} MB</div>
                    <div class="file-info"><strong>Type:</strong> ${file.file_type || 'Unknown'}</div>
                    <div class="file-info"><strong>Uploaded:</strong> ${uploadDate.toLocaleString()}</div>
                    <button class="file-download-btn" onclick="downloadFile('${file.node_id}', ${file.id})">
                        Download File
                    </button>
                `;
                
                filesGrid.appendChild(card);
            });
        }
        
        async function downloadFile(nodeId, fileId) {
            const ip = document.getElementById('serverIp').value;
            
            try {
                log(`Requesting download URL for file ID: ${fileId}...`, 'info');
                
                const response = await fetch(`http://${ip}:3000/api/files/${nodeId}/${fileId}/download`);
                const result = await response.json();
                
                if (result.success) {
                    log(`Download URL generated. Starting download...`, 'info');
                    
                    // Open download in new tab
                    window.open(result.url, '_blank');
                    
                    log(`File: ${result.filename}`, 'info');
                } else {
                    alert('Error: ' + result.error);
                }
            } catch (error) {
                log(`Download error: ${error.message}`, 'info');
                alert('Error generating download URL: ' + error.message);
            }
        }
        
        setInterval(() => {
            const now = Date.now();
            nodes.forEach((nodeData, nodeId) => {
                if (nodeData.lastUpdate && (now - nodeData.lastUpdate.getTime() > 10000)) {
                    markNodeInactive(nodeId);
                }
            });
        }, 5000);
    </script>
</body>

        </div>

        <div class="stats-panel">
            <h2>System Statistics</h2>
            <button onclick="fetchNodes()">Fetch Nodes</button>
            <button onclick="fetchStats()">Refresh Stats</button>
            <div class="stats-grid" id="systemStats">
                <div class="stat-item">
                    <div class="stat-value" id="totalNodes">0</div>
                    <div class="stat-label">Active Nodes</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value" id="totalTelemetry">0</div>
                    <div class="stat-label">Total Telemetry Records</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value" id="lastUpdate">--</div>
                    <div class="stat-label">Last Update</div>
                </div>
            </div>
        </div>

        <h2>Active Nodes Telemetry</h2>
        <div class="nodes-grid" id="nodesGrid">
            <div style="grid-column: 1 / -1; text-align: center; color: #888; padding: 40px;">
            </div>
        </div>

        <div class="stats-panel">
            <h2>Active File Transfers</h2>
            <div id="fileTransfers" style="margin-top: 15px;">
                <em style="color: #888;">No active file transfers...</em>
            </div>
        </div>

        <div class="stats-panel">
            <h2> Uploaded Files</h2>
            <button onclick="fetchFiles()">Refresh Files</button>
            <div id="filesGrid" style="margin-top: 20px;">
            </div>
        </div>

        <div class="telemetry-log">
            <h2>Telemetry Log</h2>
            <div id="telemetryLog"></div>
        </div>
    </div>

    <script>
        let socket = null;
        const nodes = new Map(); 
        function log(message, type = 'info') {
            const logDiv = document.getElementById('telemetryLog');
            const entry = document.createElement('div');
            entry.className = `log-entry ${type}`;
            entry.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
            logDiv.appendChild(entry);
            logDiv.scrollTop = logDiv.scrollHeight;
        }
        
        function updateStatus(text, connected) {
            const status = document.getElementById('status');
            status.textContent = 'Status: ' + text;
            status.className = 'status-box ' + (connected ? 'connected' : 'disconnected');
        }
        
        function connect() {
            if (socket) {
                socket.disconnect();
            }
            
            const ip = document.getElementById('serverIp').value;
            const url = `http://${ip}:3001`;
            log(`Connecting to ${url} as webapp...`, 'node-connect');
            
            socket = io(url);
            
            socket.on('connect', () => {
                log(`Connected! Socket ID: ${socket.id}`, 'node-connect');
                updateStatus('Connected', true);
                socket.emit('identify', { type: 'webapp', nodeId: null });
            });
            
            socket.on('disconnect', () => {
                log(' Disconnected from server', 'node-disconnect');
                updateStatus('Disconnected', false);
            });
            
            socket.on('nodes-list', (nodesList) => {
                log(`Received nodes list: ${nodesList.length} nodes`, 'info');
                nodesList.forEach(node => {
                    if (node.status === 'online' && !nodes.has(node.node_id)) {
                        createNodePanel(node.node_id);
                    }
                });
            });
            
            socket.on('telemetry-update', (data) => {
                handleTelemetryUpdate(data);
            });
            
            socket.on('node-status', (data) => {
                log(`Node ${data.nodeId} is ${data.status}`, 'info');
                if (data.status === 'offline') {
                    markNodeInactive(data.nodeId);
                } else if (data.status === 'online') {
                    if (!nodes.has(data.nodeId)) {
                        createNodePanel(data.nodeId);
                    }
                }
            });
            
            
            // File transfer started
            socket.on('file-started', (data) => {
                log(`New file transfer started: ${data.filename} (${data.totalPackets} packets, ${(data.fileSize / 1024).toFixed(2)} KB)`, 'node-connect');
                
                const transfersDiv = document.getElementById('fileTransfers');
                
                // Remove "no transfers" message
                if (transfersDiv.querySelector('em')) {
                    transfersDiv.innerHTML = '';
                }
                
                // Create progress card
                const card = document.createElement('div');
                card.className = 'file-card';
                card.id = `transfer-${data.fileId}`;
                card.innerHTML = `
                    <h4>${data.filename}</h4>
                    <div class="file-info"><strong>Node:</strong> ${data.nodeId}</div>
                    <div class="file-info"><strong>Size:</strong> ${(data.fileSize / 1024).toFixed(2)} KB</div>
                    <div class="file-info"><strong>Packets:</strong> <span id="packets-${data.fileId}">0 / ${data.totalPackets}</span></div>
                    <div style="background: #000; height: 20px; border-radius: 5px; margin: 10px 0; overflow: hidden;">
                        <div id="progress-${data.fileId}" style="background: #2196F3; height: 100%; width: 0%; transition: width 0.3s;"></div>
                    </div>
                    <div id="status-${data.fileId}" style="color: #aaa; font-size: 12px;">Receiving...</div>
                `;
                
                transfersDiv.appendChild(card);
            });
            
            // Packet progress update
            socket.on('packet-progress', (data) => {
                const progressBar = document.getElementById(`progress-${data.fileId}`);
                const packetsText = document.getElementById(`packets-${data.fileId}`);
                const statusText = document.getElementById(`status-${data.fileId}`);
                
                if (progressBar && packetsText && statusText) {
                    progressBar.style.width = data.percent + '%';
                    packetsText.textContent = `${data.received} / ${data.total}`;
                    statusText.textContent = `Receiving: ${data.percent}%`;
                }
            });
            
            // File transfer complete
            socket.on('file-complete', (data) => {
                log(`File transfer complete: ${data.filename} (${(data.fileSize / 1024).toFixed(2)} KB)`, 'node-connect');
                
                const statusText = document.getElementById(`status-${data.fileId}`);
                if (statusText) {
                    statusText.innerHTML = `
                        <span style="color: #4CAF50;">Complete!</span><br>
                        <button class="file-download-btn" onclick="downloadAssembledFile('${data.fileId}', '${data.filename}')" style="margin-top: 5px;">
                            Download File
                        </button>
                    `;
                }
            });
            
            // File transfer failed
            socket.on('file-failed', (data) => {
                log(` File transfer failed: ${data.error}`, 'info');
                
                const statusText = document.getElementById(`status-${data.fileId}`);
                if (statusText) {
                    statusText.innerHTML = `<span style="color: #f44336;"> Failed: ${data.error}</span>`;
                }
            });
            
            // New file uploaded (for the old upload method)
            socket.on('new-file', (data) => {
                log(` New file uploaded by ${data.nodeId}: ${data.filename} (${(data.fileSize / 1024 / 1024).toFixed(2)} MB)`, 'node-connect');
                fetchFiles(); // Refresh file list
            });
        }
        
        function handleTelemetryUpdate(data) {
            const nodeId = data.nodeId;
            const now = new Date();
            
            log(`[${nodeId}] Az=${data.azimuth.toFixed(1)}° El=${data.elevation.toFixed(1)}° Signal=${data.signalStrength.toFixed(1)}dBm Temp=${data.temperature.toFixed(1)}°C`);
            
            if (!nodes.has(nodeId)) {
                createNodePanel(nodeId);
            }
            
            const nodeData = nodes.get(nodeId);
            nodeData.data = data;
            nodeData.lastUpdate = now;
            
            updateNodePanel(nodeId, data, now);
            updateSystemStats();
        }
        
        function createNodePanel(nodeId) {
            const grid = document.getElementById('nodesGrid');
            
            // Remove placeholder if exists
            const placeholder = grid.querySelector('div[style*="grid-column"]');
            if (placeholder) {
                placeholder.remove();
            }
            
            const panel = document.createElement('div');
            panel.className = 'node-panel';
            panel.id = `node-${nodeId}`;
            
            panel.innerHTML = `
                <div class="node-header">
                    <div class="node-id">${nodeId}</div>
                    <div class="node-status active">Active</div>
                </div>
                <div class="metric">
                    <span class="metric-label">Azimuth:</span>
                    <span class="metric-value" id="az-${nodeId}">--</span>
                </div>
                <div class="metric">
                    <span class="metric-label">Elevation:</span>
                    <span class="metric-value" id="el-${nodeId}">--</span>
                </div>
                <div class="metric">
                    <span class="metric-label">Signal Strength:</span>
                    <span class="metric-value" id="sig-${nodeId}">--</span>
                </div>
                <div class="metric">
                    <span class="metric-label">Temperature:</span>
                    <span class="metric-value" id="temp-${nodeId}">--</span>
                </div>
                <div class="last-update" id="update-${nodeId}">--</div>
            `;
            
            grid.appendChild(panel);
            
            nodes.set(nodeId, {
                data: null,
                lastUpdate: null,
                element: panel
            });
            
            log(`New node connected: ${nodeId}`, 'node-connect');
        }
        
        function updateNodePanel(nodeId, data, timestamp) {
            document.getElementById(`az-${nodeId}`).textContent = data.azimuth.toFixed(2) + '°';
            document.getElementById(`el-${nodeId}`).textContent = data.elevation.toFixed(2) + '°';
            document.getElementById(`sig-${nodeId}`).textContent = data.signalStrength.toFixed(1) + ' dBm';
            document.getElementById(`temp-${nodeId}`).textContent = data.temperature.toFixed(1) + '°C';
            document.getElementById(`update-${nodeId}`).textContent = `Last: ${timestamp.toLocaleTimeString()}`;
            
            const panel = document.getElementById(`node-${nodeId}`);
            panel.classList.remove('inactive');
            const status = panel.querySelector('.node-status');
            status.textContent = 'Active';
            status.classList.add('active');
            status.classList.remove('inactive');
        }
        
        function markNodeInactive(nodeId) {
            if (nodes.has(nodeId)) {
                const panel = document.getElementById(`node-${nodeId}`);
                if (panel) {
                    panel.classList.add('inactive');
                    const status = panel.querySelector('.node-status');
                    status.textContent = 'Inactive';
                    status.classList.remove('active');
                    status.classList.add('inactive');
                }
            }
        }
        
        function disconnect() {
            if (socket) {
                socket.disconnect();
                socket = null;
                updateStatus('Disconnected', false);
                log('Disconnected', 'node-disconnect');
            }
        }
        
        async function fetchStats() {
            const ip = document.getElementById('serverIp').value;
            
            try {
                // Fetch all nodes
                const nodesResponse = await fetch(`http://${ip}:3000/api/nodes`);
                const nodesResult = await nodesResponse.json();
                
                if (nodesResult.success) {
                    const nodesList = nodesResult.data;
                    document.getElementById('totalNodes').textContent = nodesList.filter(n => n.status === 'online').length;
                    
                    let totalRecords = 0;
                    let lastUpdate = null;
                    
                    for (const node of nodesList) {
                        try {
                            const statsResponse = await fetch(`http://${ip}:3000/api/stats/${node.node_id}`);
                            const statsResult = await statsResponse.json();
                            
                            if (statsResult.success && statsResult.data) {
                                totalRecords += parseInt(statsResult.data.total_records || 0);
                                if (statsResult.data.last_update) {
                                    if (!lastUpdate || new Date(statsResult.data.last_update) > new Date(lastUpdate)) {
                                        lastUpdate = statsResult.data.last_update;
                                    }
                                }
                            }
                        } catch (err) {
                            // Skip if stats fetch fails for a node
                        }
                    }
                    
                    document.getElementById('totalTelemetry').textContent = totalRecords;
                    document.getElementById('lastUpdate').textContent = lastUpdate ? new Date(lastUpdate).toLocaleString() : '--';
                }
            } catch (error) {
                log(`Error fetching stats: ${error.message}`, 'info');
            }
        }
        
        async function fetchNodes() {
            const ip = document.getElementById('serverIp').value;
            
            try {
                const response = await fetch(`http://${ip}:3000/api/nodes`);
                const result = await response.json();
                
                if (result.success) {
                    log(`Fetched ${result.data.length} nodes from database`, 'info');
                    result.data.forEach(node => {
                        if (node.status === 'online' && !nodes.has(node.node_id)) {
                            createNodePanel(node.node_id);
                        }
                    });
                    updateSystemStats();
                }
            } catch (error) {
                log(`Error fetching nodes: ${error.message}`, 'info');
            }
        }
        
        function updateSystemStats() {
          
            let activeCount = 0;
            nodes.forEach((nodeData, nodeId) => {
                const panel = document.getElementById(`node-${nodeId}`);
                if (panel && !panel.classList.contains('inactive')) {
                    activeCount++;
                }
            });
            document.getElementById('totalNodes').textContent = activeCount;
        }
        // Download assembled file
        async function downloadAssembledFile(fileId, filename) {
            const ip = document.getElementById('serverIp').value;
            
            try {
                log(`Requesting download URL for file: ${filename}...`, 'info');
                
                const response = await fetch(`http://${ip}:3000/api/files/${fileId}/download`);
                const result = await response.json();
                
                if (result.success) {
                    window.open(result.url, '_blank');
                    log(`Download started: ${filename}`, 'info');
                } else {
                    alert('Error: ' + result.error);
                }
            } catch (error) {
                log(`Download error: ${error.message}`, 'info');
                alert('Error: ' + error.message);
            }
        }
        
        async function fetchFiles() {
            const ip = document.getElementById('serverIp').value;
            
            try {
                const response = await fetch(`http://${ip}:3000/api/files?limit=20`);
                const result = await response.json();
                
                if (result.success) {
                    displayFiles(result.data);
                    log(`Fetched ${result.data.length} files from database`, 'info');
                }
            } catch (error) {
                log(`Error fetching files: ${error.message}`, 'info');
            }
        }
        
        function displayFiles(files) {
            const filesGrid = document.getElementById('filesGrid');
            
            if (files.length === 0) {
                filesGrid.innerHTML = '<em style="color: #888;">No files uploaded yet.</em>';
                return;
            }
            
            filesGrid.className = 'files-grid';
            filesGrid.innerHTML = '';
            
            files.forEach(file => {
                const card = document.createElement('div');
                card.className = 'file-card';
                
                const uploadDate = new Date(file.upload_timestamp);
                const fileSize = (file.file_size / 1024 / 1024).toFixed(2);
                
                card.innerHTML = `
                    <h4> ${file.filename}</h4>
                    <div class="file-info"><strong>Node:</strong> ${file.node_id}</div>
                    <div class="file-info"><strong>Size:</strong> ${fileSize} MB</div>
                    <div class="file-info"><strong>Type:</strong> ${file.file_type || 'Unknown'}</div>
                    <div class="file-info"><strong>Uploaded:</strong> ${uploadDate.toLocaleString()}</div>
                    <button class="file-download-btn" onclick="downloadFile('${file.node_id}', ${file.id})">
                        Download File
                    </button>
                `;
                
                filesGrid.appendChild(card);
            });
        }
        
        async function downloadFile(nodeId, fileId) {
            const ip = document.getElementById('serverIp').value;
            
            try {
                log(`Requesting download URL for file ID: ${fileId}...`, 'info');
                
                const response = await fetch(`http://${ip}:3000/api/files/${nodeId}/${fileId}/download`);
                const result = await response.json();
                
                if (result.success) {
                    log(`Download URL generated. Starting download...`, 'info');
                    
                    // Open download in new tab
                    window.open(result.url, '_blank');
                    
                    log(`File: ${result.filename}`, 'info');
                } else {
                    alert('Error: ' + result.error);
                }
            } catch (error) {
                log(`Download error: ${error.message}`, 'info');
                alert('Error generating download URL: ' + error.message);
            }
        }
        
        setInterval(() => {
            const now = Date.now();
            nodes.forEach((nodeData, nodeId) => {
                if (nodeData.lastUpdate && (now - nodeData.lastUpdate.getTime() > 10000)) {
                    markNodeInactive(nodeId);
                }
            });
        }, 5000);
    </script>
</body>
</html>
